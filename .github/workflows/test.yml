name: test

# T043: CI for Linux / macOS / Windows. A workflow file is not evidence of a
# run — the platform matrix (docs/COMPATIBILITY.md) only lists platforms
# with a passing record in evidence/platforms/.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (no network model needed for core tests)
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e ".[dev]" || .venv\Scripts\python -m pip install -e ".[dev]"
      - name: Core tests
        run: .venv/bin/python -m pytest tests/ -q || .venv\Scripts\python -m pytest tests/ -q
      - name: Journeys (offline, no model)
        run: |
          .venv/bin/python scripts/run_journey.py --mode cli --journey J01 --no-model || .venv\Scripts\python scripts/run_journey.py --mode cli --journey J01 --no-model
          .venv/bin/python scripts/run_journey.py --mode cli --journey J05 --no-model || .venv\Scripts\python scripts/run_journey.py --mode cli --journey J05 --no-model
      - name: Replay suite
        run: .venv/bin/python benchmarks/replay.py --suite core-change --output evidence/replay || .venv\Scripts\python benchmarks/replay.py --suite core-change --output evidence/replay
